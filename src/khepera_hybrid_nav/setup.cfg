[develop]
script_dir=$base/lib/khepera_hybrid_nav
[install]
install_scripts=$base/lib/khepera_hybrid_nav

[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,CNL100,E203,E501,Q000
import-order-style = pep8
max-line-length = 100
statistics = True
count = True
show-source = True

[tool:pytest]
addopts = -m "not linter" -p no:pytest-qt
