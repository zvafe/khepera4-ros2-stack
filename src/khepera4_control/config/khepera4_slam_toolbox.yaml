# Khepera IV SLAM Toolbox Configuration
# Optimized for Khepera IV mobile robot dimensions and sparse multi-sensor scan (/khepera4/scan)

slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Solver Plugin Parameters
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Frame & Topic Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /khepera4/scan
    use_map_saver: true
    mode: mapping

    # Spatial Resolution & Sensor Range (Khepera IV arena 2.5m x 2.5m)
    resolution: 0.03
    max_laser_range: 3.5
    min_laser_range: 0.05
    minimum_time_interval: 0.1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # Scan Matcher Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.15
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 3.5
    link_match_minimum_response_fine: 0.20
    link_scan_maximum_distance: 2.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 1.5
    loop_match_minimum_response_coarse: 0.60
    loop_match_minimum_response_fine: 0.70

    # Correlation Search Parameters (Stable Karto probability search space)
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closing Search Parameters
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.03
    loop_search_space_smear_deviation: 0.05

    # Scan Matcher Penalties (High angle penalty prevents rotational twisting)
    distance_variance_penalty: 0.5
    angle_variance_penalty: 2.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
