services:
  # ============================================================================
  # Mode 1: khepera-native
  # High-performance native GUI with GPU acceleration for Linux & Windows 11 WSLg
  # ============================================================================
  khepera-native:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: khepera4:latest
    container_name: khepera-native
    profiles:
      - native
    working_dir: /workspace
    stdin_open: true
    tty: true
    privileged: true
    ipc: host
    network_mode: host
    env_file:
      - path: ../.env
        required: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-0}
    volumes:
      - ..:/workspace:rw
      - ../docker/entrypoint.sh:/entrypoint.sh:ro
      - ../docker/start-web.sh:/start-web.sh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["/entrypoint.sh"]
    command: ["bash"]

  # ============================================================================
  # Mode 2: khepera-web
  # Self-contained noVNC browser interface for low-spec PCs, Macs & college demos
  # Avoids port 1947; maps ${KHEPERA_WEB_PORT:-6080}:80
  # ============================================================================
  khepera-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: khepera4:latest
    container_name: khepera-web
    profiles:
      - web
    working_dir: /workspace
    shm_size: "2gb"
    env_file:
      - path: ../.env
        required: false
    environment:
      - DISPLAY=:1
      - RESOLUTION=${RESOLUTION:-1920x1080x24}
      - KHEPERA_WEB_PORT=${KHEPERA_WEB_PORT:-6080}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-0}
    ports:
      - "${KHEPERA_WEB_PORT:-6080}:80"
    volumes:
      - ..:/workspace:rw
      - ../docker/entrypoint.sh:/entrypoint.sh:ro
      - ../docker/start-web.sh:/start-web.sh:ro
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["/entrypoint.sh"]
    command: ["/start-web.sh"]
